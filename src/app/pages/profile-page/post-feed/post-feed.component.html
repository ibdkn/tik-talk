<app-post-input [profile]="profile()" (created)="onCreatePost($event)"></app-post-input>

<div #feedWrapper class="post-feed__wrapper">
  @for (post of feed(); track post.id) {
    <app-post #postComp [profile]="profile()" [post]="post"
              (commentCreated)="onCreateComment($event.postId, $event.commentText)"
              (postDeleted)="onDeletePost($event.postId)"
              (postUpdated)="updatePost($event.postId, $event.text)"
    ></app-post>
  }
</div>
