<img [src]="preview()" alt="" class="avatar">

<div class="dropzone" tabindex="0" dnd (keyup.enter)="filedrop.click()" (fileDropped)="onFileDropped($event)">
  <div class="dropzone-content">
    <svg icon="upload"></svg>
    <span class="medium-text">
      Перетащите изображение или Загрузите (разрешение до 5,000 x 5,000 px)
    </span>
  </div>

  <input type="file" class="avatar-input" tabindex="-1" #filedrop (change)="fileBrowserHandler($event)" [(ngModel)]="avatar">
</div>
