@if (chat(); as chat) {
  <app-avatar-circle [avatarUrl]="chat.userFrom.avatarUrl" class="size32"></app-avatar-circle>

  <div class="last-message__wrapper">
    <p class="medium-text chat-user">{{ chat.userFrom.firstName }} {{ chat.userFrom.lastName }}</p>
    <p class="medium-text">{{ chat.message || '...' }}</p>
  </div>
}
