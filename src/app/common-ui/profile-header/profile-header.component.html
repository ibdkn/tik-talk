@if (profile(); as profile) {
  @if (profile.avatarUrl) {
    <img [src]="profile.avatarUrl | imgUrl" class="footer-sidebar-avatar">
  } @else {
    <img src="/assets/images/avatar-placeholder.png" class="footer-sidebar-avatar">
  }
  <div class="user-info">
    <p class="user-full-name h4">{{ profile.firstName }} {{ profile.lastName }}</p>
    <span class="username regular">{{ profile.username }}</span>
  </div>
}
