@if (chat(); as chat) {
  <app-avatar-circle
    [avatarUrl]="chat.userFrom.avatarUrl"
    class="size32"
  ></app-avatar-circle>

  <div class="last-message__wrapper">
    <p class="medium-text chat-user">
      <span class="username">{{ chat.userFrom.firstName }} {{ chat.userFrom.lastName }}</span>
      <span class="date-message">{{ chat.createdAt | date:'dd.MM.yyyy' }}</span>
    </p>
    <p class="medium-text message-info">
      @if (chat.message) {
        <span class="message-text" [innerHTML]="chat.message | markdownLinks"></span>
      } @else {
        <span class="message-text content-empty">У вас пока нет сообщений. Напишите первым!</span>
      }
      @if (chat.unreadMessages) {
        <span class="message-count">{{chat.unreadMessages}}</span>
      }
    </p>
  </div>
}
