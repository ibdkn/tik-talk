<div class="chats-filters-input__wrapper">
  <label class="tt-form-label">
    <input
      type="text"
      class="tt-form-input"
      placeholder="Искать..."
      [formControl]="filterChatsControl"
    />
  </label>
</div>

<div class="chat-list-wrapper" #chatListWrapper>
  @for (chat of chats$ | async; track chat.id) {
    <button
      [routerLink]="[chat.id]"
      routerLinkActive="active"
      chats
      [chat]="chat"
    ></button>
  }
</div>
