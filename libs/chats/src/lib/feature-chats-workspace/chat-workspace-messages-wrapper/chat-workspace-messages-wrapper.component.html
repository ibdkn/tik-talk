<div #scrollToBottom #chatWrapper class="messages-wrapper">
  @for (dateAndMessages of dateAndMessages(); track $index) {
    <app-message-date-group [messageData]="dateAndMessages.date" class="date-message-group"></app-message-date-group>

    @for (message of dateAndMessages.messages; track message.id) {
      <app-chat-message class="mb12" [message]="message"></app-chat-message>
    }
  }
</div>

<app-common-input
  (created)="onSendMessage($event)"
  [isChatInput]="true"
  class="size32"
></app-common-input>
