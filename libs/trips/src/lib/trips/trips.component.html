<form (ngSubmit)="onSubmit($event)">
  <input type="text" class="tt-input" name="username" noReact
         [(ngModel)]="username"
         (ngModelChange)="onChange($event)"
         #usernameControl="ngModel"
  >

  @if (usernameControl.hasError('noReact')) {
    <span>Error</span>
  }

  <button type="submit">Submit</button>
</form>
