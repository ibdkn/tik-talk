<div class="community-filter search-filter">
  <form class="search-filter__form" [formGroup]="searchForm">
    <tt-input
      [type]="'text'"
      [labelText]="'Название сообщества'"
      [placeholder]="'Введите'"
      formControlName="name"
    >
      <span class="tt-form-icon" icon>
        <svg [icon]="'search'"></svg>
      </span>
    </tt-input>
    <tt-select
      [labelText]="'Тема'"
      [placeholder]="'Выберите'"
      formControlName="themes"
    >
      <span class="tt-form-icon" icon>
        <svg [icon]="'search'"></svg>
      </span>
    </tt-select>
    <tt-list-input
      [labelText]="'Теги'"
      [placeholder]="'Введите'"
      formControlName="tags"
    >
      <span class="tt-form-icon" icon>
        <svg [icon]="'search'"></svg>
      </span>
    </tt-list-input>
  </form>
</div>
