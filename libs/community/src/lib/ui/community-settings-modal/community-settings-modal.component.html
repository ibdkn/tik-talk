<tt-modal-base>
  <div class="common-modal">
    <div class="common-modal__header">
      <div></div>

      <button
        class="common-modal__close"
        type="button"
        (click)="hide()"
      >
        <svg [icon]="'cross'" class="svg10"></svg>
      </button>
    </div>

    <div class="common-modal__body">
      <form class="common-modal__form" [formGroup]="communityForm" (ngSubmit)="onSubmit()">
        <tt-input
          [type]="'text'"
          [labelText]="'Название сообщества'"
          [placeholder]="'Введите'"
          formControlName="name"
        >
          <span class="tt-form-icon" icon>
            <svg [icon]="'search'"></svg>
          </span>
        </tt-input>

        <tt-select
          [labelText]="'Тема'"
          [placeholder]="'Выберите'"
          formControlName="themes"
        >
          <span class="tt-form-icon" icon>
            <svg [icon]="'search'"></svg>
          </span>
        </tt-select>

        <tt-list-input
          [labelText]="'Теги'"
          [placeholder]="'Введите'"
          formControlName="tags"
        >
          <span class="tt-form-icon" icon>
            <svg [icon]="'search'"></svg>
          </span>
        </tt-list-input>

        <tt-textarea
          [labelText]="'Описание'"
          [placeholder]="'Введите'"
          formControlName="description"
        />

        <div class="common-modal__footer">
          <div class="common-modal__footer-left">
            @if (community(); as community) {
              <button
                type="button"
                class="btn btn-transparent-with-icon"
                (click)="openDeleteModal()"
                aria-label="Удалить сообщество"
              >
              <span class="tt-form-icon" icon>
                <svg [icon]="'delete'"></svg>
              </span>
              </button>
            }
          </div>

          <div class="common-modal__actions">
            <button type="button" class="btn btn-light-transparent" (click)="hide()">Отмена</button>
            <button type="submit" class="btn">Сохранить</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</tt-modal-base>
