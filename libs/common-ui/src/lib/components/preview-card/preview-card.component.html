@if (data) {
  <div [ngClass]="['preview-card', data.isMine ? 'mine' : '']">
    <tt-avatar-name
      [avatarUrl]="data.avatarUrl"
      [title]="data.title"
      [subtitle]="data.subtitle"
    />

    @if (data.description) {
      <div class="preview-card__description">
        {{ data.description }}
      </div>
    }

    <div class="preview-card__tags">
      @for (tag of data.tags; track tag) {
        <div class="list-item">{{ tag }}</div>
      }
    </div>

    <div class="preview-card__action-btns">
      @if (!data.isMine && data.primaryLabel) {
        <button [ngClass]="['btn', data.isJoined ? 'btn-light-transparent' : '']" (click)="subscribeHandler(data.id)">
          <span>{{ data.primaryLabel }}</span>
          <svg [icon]="data.icon" class="svg16"></svg>
        </button>
      }
      @if (data.secondaryLink) {
        <a [ngClass]="['btn btn-icon', data.isJoined ? 'btn-primary-transparent' : '']" [routerLink]="data.secondaryLink">
          <svg [icon]="'arrow-link'" class="svg16"></svg>
        </a>
      }
    </div>
  </div>
}
