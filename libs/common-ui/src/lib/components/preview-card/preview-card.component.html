@if (card(); as card) {
  <div [ngClass]="['preview-card', card.isOwnedByCurrentUser ? 'mine' : '']">
    <tt-avatar-name
      [avatarUrl]="card.avatarUrl"
      [title]="card.title"
      [subtitle]="card.subtitle"
    />

    @if (card.description) {
      <div class="preview-card__description">
        {{ card.description }}
      </div>
    }

    <div class="preview-card__tags">
      @for (tag of card.tags; track tag) {
        <div class="list-item">{{ tag }}</div>
      }
    </div>

    <div class="preview-card__action-btns">
      @if (!card.isOwnedByCurrentUser && card.primaryLabel) {
        <button [ngClass]="['btn', card.isJoined ? 'btn-light-transparent' : '']" (click)="subscribeHandler(card.id)">
          <span>{{ card.primaryLabel }}</span>
          <svg [icon]="card.icon" class="svg16"></svg>
        </button>
      }
      @if (card.secondaryLink) {
        <a [ngClass]="['btn btn-icon', card.isJoined ? 'btn-primary-transparent' : '']" [routerLink]="card.secondaryLink">
          <svg [icon]="'arrow-link'" class="svg16"></svg>
        </a>
      }
    </div>
  </div>
}
