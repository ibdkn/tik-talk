<div class="search-filter">
  <form class="search-filter__form" [formGroup]="formGroupData">
    @for (data of searchFilterData; track data.formControlName) {
      @if (['stack', 'tag'].includes(data.formControlName)) {
        <tt-list-input-control
          [labelText]="data.labelText"
          [icon]="data.icon"
          [placeholder]="data.placeholder"
          [formControlName]="data.formControlName"
        />
      } @else {
        <tt-text-input-control
          [labelText]="data.labelText"
          [icon]="data.icon"
          [placeholder]="data.placeholder"
          [formControlName]="data.formControlName"
        />
      }
    }
  </form>
</div>
