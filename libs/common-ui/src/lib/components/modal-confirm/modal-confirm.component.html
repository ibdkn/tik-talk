<tt-modal-base>
  <div class="common-modal">
    <div class="common-modal__header">
      <div></div>
      <button
        class="common-modal__close"
        type="button"
        (click)="onCancel()"
      >
        <svg [icon]="'cross'" class="svg10"></svg>
      </button>
    </div>
    <div class="common-modal__body">
      <p class="medium-text mb20">Уверены, что хотите удалить?</p>
      <div class="common-modal__footer">
        <div class="common-modal__footer-left"></div>

        <div class="common-modal__actions">
          <button type="button" class="btn btn-light-transparent" (click)="onCancel()">Отмена</button>
          <button type="button" class="btn" (click)="onConfirm()">Удалить</button>
        </div>
      </div>
    </div>
  </div>
</tt-modal-base>
