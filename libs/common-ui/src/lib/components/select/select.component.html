<label class="select tt-form-label">
  <span class="tt-form-label-text">{{ labelText() }}</span>
  <div #wrapper class="select__wrapper"
       [class.with-icon]="!!icon()"
       [class.filled]="value$.value.length > 0"
       (click)="open()"
  >
    @for (item of value$ | async; track item; let i = $index) {
      <div class="select__item list-item">
        <button class="select__btn" (click)="onDelete(i)" type="button">
          <svg [icon]="'cross'" class="svg10"></svg>
        </button>
        <span>{{ item }}</span>
      </div>
    }

    <input type="text" class="select__ghost-input"
           [placeholder]="(value$ | async)!.length > 0 ? '' : placeholder()"
           readonly
    />

    <ng-content select='[icon]'></ng-content>
  </div>
</label>
<ul #optionsList class="option-list" role="listbox" [class.opened]="isOpen">
  @for (option of selectOptions; track option) {
    <li class="option-list__item"
        [class.active]="isSelected(option)"
        [attr.aria-selected]="isSelected(option)"
        (click)="onToggleOption(option)"
    >
      <span class="text list-item">{{ option }}</span>
      <svg class="icon svg16" [icon]="'selected-arrow'"></svg>
    </li>
  }
</ul>
