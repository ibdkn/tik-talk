<label class="tt-form-label" [class.with-icon]="!!icon()">
  <span class="tt-form-label-text">{{ labelText() }}</span>
  <input type="text" class="tt-form-input"
    [placeholder]="placeholder()"
    [ngModel]="value"
    (ngModelChange)="onInput($event)"
    (blur)="onTouched()"
  />
  @if (icon(); as icon) {
    <span class="tt-form-icon">
      <svg [icon]="icon"></svg>
    </span>
  }
</label>
<ng-content></ng-content>
