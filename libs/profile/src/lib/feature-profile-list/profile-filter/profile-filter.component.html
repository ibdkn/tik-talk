<div class="profile-filter search-filter">
  <form class="search-filter__form" [formGroup]="searchForm">
    <tt-input
      [type]="'text'"
      [labelText]="'Имя пользователя'"
      [placeholder]="'Введите'"
      formControlName="firstName"
    >
      <span class="tt-form-icon" icon>
        <svg [icon]="'search'"></svg>
      </span>
    </tt-input>
    <tt-input
      [type]="'text'"
      [labelText]="'Фамилия пользователя'"
      [placeholder]="'Введите'"
      formControlName="lastName"
    >
      <span class="tt-form-icon" icon>
        <svg [icon]="'search'"></svg>
      </span>
    </tt-input>
    <tt-list-input
      [labelText]="'Навыки'"
      [placeholder]="'Введите'"
      formControlName="stack"
    >
      <span class="tt-form-icon" icon>
        <svg [icon]="'search'"></svg>
      </span>
    </tt-list-input>
  </form>
</div>
