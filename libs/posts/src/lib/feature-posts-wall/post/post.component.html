@if (post(); as post) {
<app-avatar-circle
  [avatarUrl]="post.author.avatarUrl"
  class="size32"
></app-avatar-circle>

<main class="post__content">
  <div class="post__body">
    <div>
      <strong class="post__author">
        <span>{{ authorName }}</span>
        <span class="post-created-at">{{ post.createdAt | timeAgo }}</span>
      </strong>
      @if (isEditable) {
      <app-common-input
        [currentAuthor]="currentAuthor()"
        [content]="post.content"
        [isEditableInput]="true"
        (canceled)="isEditable = $event"
        (saved)="onUpdatePost($event)"
      ></app-common-input>
      } @else {
        <p class="medium-text" [innerHTML]="post.content | markdownLinks"></p>
      }
    </div>
    @if(isMyPost()) {
      <button
        class="btn btn-post-menu"
        [ngClass]="isShowPostModal ? 'active' : ''"
        (click)="isShowPostModal = !isShowPostModal"
      >
        <svg icon="dots" class="svg14"></svg>

        @if (isShowPostModal) {
          <ul
            class="post-modal"
            clickOutside
            (clickOutside)="isShowPostModal = false"
          >
            <li class="post-modal-text" (click)="isEditable = !isEditable">
              <svg icon="edit-pen" class="svg14"></svg>
              <span>Редактировать</span>
            </li>
            <li class="post-modal-text" (click)="onDeletePost()">
              <svg icon="trash" class="svg14"></svg>
              <span>Удалить</span>
            </li>
          </ul>
        }
      </button>
    }
  </div>

  <div class="post-counters">
    <span class="comment-amount">
      <svg icon="comments" class="svg16"></svg>
      <span class="comments-length">{{ comments().length }}</span>
    </span>
  </div>

  <div class="post__comments-wrapper">
    @for (comment of comments(); track comment.id) {
    <app-comment [comment]="comment"></app-comment>
    }
  </div>

  <app-common-input
    [currentAuthor]="myProfile()"
    [isCommentInput]="true"
    [postId]="post.id"
    (created)="onCreateComment($event)"
  ></app-common-input>
</main>
}
