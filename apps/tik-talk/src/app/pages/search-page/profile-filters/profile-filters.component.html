<form class="profile-search-form__wrapper" [formGroup]="searchForm">
  <div class="profile-search-form">
    <label class="tt-form-label">
      <span class="tt-form-label-text">Имя пользователя</span>
      <input
        type="text"
        class="tt-form-input"
        placeholder="Выберите"
        formControlName="firstName"
      />
    </label>
    <label class="tt-form-label">
      <span class="tt-form-label-text">Фамилия пользователя</span>
      <input
        type="text"
        class="tt-form-input"
        placeholder="Выберите"
        formControlName="lastName"
      />
    </label>
    <label class="tt-form-label">
      <span class="tt-form-label-text">Навыки</span>
      <input
        type="text"
        class="tt-form-input"
        placeholder="Введите данные"
        formControlName="stack"
      />
    </label>
  </div>
</form>
